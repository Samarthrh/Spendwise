services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/spendwise
      - JWT_SECRET=spendwise_production_secret_key_change_me
      - OCR_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
  uploads_data:
